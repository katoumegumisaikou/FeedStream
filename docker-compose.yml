# feed_system 本地依赖服务
# 用法:
#   docker compose up -d          # 后台启动 PostgreSQL + Redis
#   docker compose down           # 停止 + 删容器
#   docker compose down -v        # 停止 + 删容器 + 删数据卷(慎用)
#   docker compose logs -f        # 看日志
#
# 启动后再跑:
#   cp backend/.env.example backend/.env    # 如需改默认值
#   make dev                                # 并发启动后端 + 前端

services:
  postgres:
    image: postgres:16-alpine
    container_name: feed-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feed_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feed_system"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: feed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata: